services:
  evolution-api:
    image: ghcr.io/evolutionapi/evolution-api:v2.1.1
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=my_secure_api_key_123
      - DATABASE_PROVIDER=sqlite
      - DATABASE_CONNECTION_URI=file://../database.db
    restart: always